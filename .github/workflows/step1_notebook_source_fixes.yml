name: Step 1 notebook source fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step1_notebook_source_fixes.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate notebook source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('step1_apply.py')
          s = p.read_text()
          old = 'if cell["cell_type"] == "markdown":\n            s = text(cell).lower()'
          new = 'if cell["cell_type"] == "markdown" and i > 0:\n            s = heading(cell).lower()'
          if old not in s:
              raise SystemExit('Expected find_md implementation not found')
          s = s.replace(old, new, 1)
          s = s.replace('mi = find_md(nb, "target balance", "explicit unknown")', 'mi = find_md(nb, "4. target balance")', 1)
          p.write_text(s)
          PY
          python step1_apply.py

      - name: Commit fixed notebook sources and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm step1_apply.py .github/workflows/step1_notebook_source_fixes.yml
          git add 01_data_eda.ipynb 02_baseline_tuning.ipynb 03_features_imbalance.ipynb 04_segments_robustness.ipynb 05_final_validation_reporting.ipynb
          git commit -m "Clarify notebook steps, hyperparameters and feature importance"
          git push origin main
