name: Build dense final technical report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_dense_technical_report.yml'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        run: pip install reportlab pillow pymupdf

      - name: Rebuild Technical_Report.pdf from notebook outputs
        env:
          BUILDER_GZ_B64: ''
        run: |
          python - <<'PY2'
          import os,base64,gzip
          open('/tmp/build_dense_technical_report.py','wb').write(gzip.decompress(base64.b64decode(os.environ['BUILDER_GZ_B64'])))
          PY2
          python /tmp/build_dense_technical_report.py

      - name: Verify generated PDF
        run: |
          python - <<'PY2'
          import fitz
          from pathlib import Path
          p=Path('Technical_Report.pdf')
          assert p.exists() and p.stat().st_size > 400000
          d=fitz.open(p)
          assert d.page_count == 8, d.page_count
          text='\n'.join(page.get_text() for page in d)
          for token in [
              'Baseline/default specifications',
              'pre-call +duration baselines use the same hyperparameters',
              'Four selected tuned configurations',
              'Logistic Regression grouped coefficient magnitude',
              'HistGradientBoosting held-out permutation importance',
              'Shuffled vs Ordered Validation',
              'Period-Local Lift by Call Depth',
              '99 passes and zero failures'
          ]:
              assert token in text, token
          print('Technical report verification PASS:', d.page_count, 'pages', p.stat().st_size, 'bytes')
          PY2

      - name: Commit report and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/build_dense_technical_report.yml
          git add Technical_Report.pdf
          git commit -m "Rebuild dense notebook-traceable technical report"
          git push origin main
