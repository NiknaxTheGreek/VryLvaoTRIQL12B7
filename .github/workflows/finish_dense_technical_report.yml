name: Finalize dense technical report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finish_dense_technical_report.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        run: pip install reportlab pillow pymupdf pyyaml

      - name: Rebuild from the already validated report builder
        run: |
          python - <<'PY'
          import re, base64, gzip
          from pathlib import Path
          yml = Path('.github/workflows/build_dense_technical_report.yml').read_text()
          m = re.search(r"BUILDER_GZ_B64:\s*'([^']+)'", yml)
          assert m, 'embedded report builder not found'
          Path('/tmp/build_dense_technical_report.py').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY
          python /tmp/build_dense_technical_report.py

      - name: Verify PDF structure and core content
        run: |
          python - <<'PY'
          import pymupdf
          from pathlib import Path
          p=Path('Technical_Report.pdf')
          assert p.exists() and p.stat().st_size > 400000
          d=pymupdf.open(p)
          assert d.page_count == 8, d.page_count
          text='\n'.join(page.get_text() for page in d)
          for token in [
              'Baseline/default specifications',
              'Four selected tuned configurations',
              'Logistic Regression grouped coefficient magnitude',
              'HistGradientBoosting held-out permutation importance',
              'Shuffled vs Ordered Validation',
              'Period-Local Lift by Call Depth',
              '99 passes and zero failures'
          ]:
              assert token in text, token
          print('PASS:', d.page_count, 'pages;', p.stat().st_size, 'bytes')
          PY

      - name: Commit final report and clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/build_dense_technical_report.yml .github/workflows/finish_dense_technical_report.yml
          git add Technical_Report.pdf
          git commit -m "Rebuild dense notebook-traceable technical report"
          git push origin main
