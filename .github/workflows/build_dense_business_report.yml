name: Build dense final business recommendations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_dense_business_report.yml'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: pip install reportlab pillow pymupdf
      - name: Extract canonical notebook figures
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          def extract(nbfile, needle, outfile):
              nb=json.loads(Path(nbfile).read_text())
              for c in nb['cells']:
                  src=''.join(c.get('source',[]))
                  if needle.lower() not in src.lower():
                      continue
                  for o in c.get('outputs',[]):
                      data=o.get('data',{})
                      if 'image/png' in data:
                          raw=data['image/png']; raw=''.join(raw) if isinstance(raw,list) else raw
                          Path(outfile).write_bytes(base64.b64decode(raw)); return
              raise RuntimeError(f'figure not found: {needle}')
          extract('04_segments_robustness.ipynb','Shuffled vs Ordered Validation','business_shuffled_ordered.png')
          extract('05_final_validation_reporting.ipynb','Period-Local Lift by Call Depth','business_lift.png')
          PY
      - name: Build business PDF
        env:
          BUILDER_GZ_B64: ''
        run: |
          python - <<'PY'
          import os,base64,gzip
          open('/tmp/build_business.py','wb').write(gzip.decompress(base64.b64decode(os.environ['BUILDER_GZ_B64'])))
          PY
          python /tmp/build_business.py
      - name: Verify PDF
        run: |
          python - <<'PY'
          import pymupdf
          from pathlib import Path
          p=Path('Business_Recommendations.pdf'); assert p.exists() and p.stat().st_size > 50000
          d=pymupdf.open(p); assert d.page_count == 3, d.page_count
          text='\n'.join(x.get_text() for x in d)
          for token in ['Executive decision','same default hyperparameters','Period-Local Lift by Call Depth','subscriptions per 1,000 assigned calls','APPROVE FOR CONTROLLED PILOT PLANNING']:
              assert token.lower() in text.lower(), token
          print('PASS:',d.page_count,'pages',p.stat().st_size,'bytes')
          PY
      - name: Commit report and clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f business_shuffled_ordered.png business_lift.png
          git rm -f .github/workflows/build_dense_business_report.yml
          git add Business_Recommendations.pdf
          git commit -m "Rebuild dense notebook-traceable business recommendations"
          git push origin main
