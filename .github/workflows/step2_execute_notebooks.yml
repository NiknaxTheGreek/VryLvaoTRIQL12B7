name: Step 2 execute final notebooks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/step2_execute_notebooks.yml'

permissions:
  contents: write

jobs:
  execute-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pinned environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute notebooks 01 through 05
        run: |
          set -euo pipefail
          for nb in \
            01_data_eda.ipynb \
            02_baseline_tuning.ipynb \
            03_features_imbalance.ipynb \
            04_segments_robustness.ipynb \
            05_final_validation_reporting.ipynb
          do
            echo "===== EXECUTING $nb ====="
            jupyter nbconvert --to notebook --execute --inplace "$nb" \
              --ExecutePreprocessor.timeout=900 \
              --ExecutePreprocessor.kernel_name=python3
          done

      - name: Verify execution, narrative structure and canonical results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = [
              '01_data_eda.ipynb',
              '02_baseline_tuning.ipynb',
              '03_features_imbalance.ipynb',
              '04_segments_robustness.ipynb',
              '05_final_validation_reporting.ipynb',
          ]

          def output_text(nb):
              chunks=[]
              for c in nb['cells']:
                  for o in c.get('outputs', []):
                      if o.get('output_type') == 'stream':
                          t=o.get('text','')
                          chunks.append(''.join(t) if isinstance(t,list) else str(t))
                      data=o.get('data',{})
                      for k in ('text/plain','text/markdown'):
                          if k in data:
                              t=data[k]
                              chunks.append(''.join(t) if isinstance(t,list) else str(t))
              return '\n'.join(chunks)

          loaded={}
          for fn in notebooks:
              nb=json.loads(Path(fn).read_text())
              loaded[fn]=nb
              errors=[o for c in nb['cells'] for o in c.get('outputs',[]) if o.get('output_type')=='error']
              assert not errors, f'{fn}: execution error outputs found'
              code=[c for c in nb['cells'] if c['cell_type']=='code']
              assert code and all(c.get('execution_count') is not None for c in code), f'{fn}: unexecuted code cell'
              types=[c['cell_type'] for c in nb['cells']]
              assert not any(types[i]=='code' and types[i+1]=='code' for i in range(len(types)-1)), f'{fn}: consecutive code cells remain'
              src='\n'.join(''.join(c.get('source',[])) for c in nb['cells'])
              assert '/mnt/data/' not in src, f'{fn}: nonportable /mnt/data dependency'
              assert 'term-deposit-marketing-2020-labelled.csv' in src, f'{fn}: root-level labelled dataset not referenced'
              print(f'{fn}: PASS | markdown={types.count("markdown")} code={types.count("code")}')

          nb1_src='\n'.join(''.join(c.get('source',[])) for c in loaded['01_data_eda.ipynb']['cells'])
          assert 'ax.margins(y=0.16)' in nb1_src

          nb2_src='\n'.join(''.join(c.get('source',[])) for c in loaded['02_baseline_tuning.ipynb']['cells'])
          for token in ['BASELINE_PARAMS','identical across feature conditions','15 log-spaced values','28,800','320 candidate configurations']:
              assert token in nb2_src, f'NB2 missing clarity token: {token}'

          nb3_src='\n'.join(''.join(c.get('source',[])) for c in loaded['03_features_imbalance.ipynb']['cells'])
          for token in ['Logistic Regression Feature Importance','HistGradientBoosting Permutation Importance','barh']:
              assert token in nb3_src, f'NB3 missing feature-importance visual: {token}'

          checks={
              '02_baseline_tuning.ipynb':['0.240265','0.272820','8.483428982440726','0.0610540229658533'],
              '03_features_imbalance.ipynb':['0.287171','0.353059'],
              '04_segments_robustness.ipynb':['0.566290','0.551600','0.112626','0.096333'],
              '05_final_validation_reporting.ipynb':['1.853857','0.044442','0.035101'],
          }
          for fn,tokens in checks.items():
              txt=output_text(loaded[fn])
              for token in tokens:
                  assert token in txt, f'{fn}: canonical output {token} not reproduced'

          print('Canonical output verification: PASS')
          PY

      - name: Commit executed notebooks and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/step2_execute_notebooks.yml
          git add \
            01_data_eda.ipynb \
            02_baseline_tuning.ipynb \
            03_features_imbalance.ipynb \
            04_segments_robustness.ipynb \
            05_final_validation_reporting.ipynb
          git commit -m "Execute and verify final analytical notebooks"
          git push origin main
