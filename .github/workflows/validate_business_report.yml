name: Validate final business report

on:
  push:
    paths:
      - '.github/workflows/validate_business_report.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF validation dependency
        run: python -m pip install pymupdf
      - name: Render and preflight report
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          p=Path('Business_Recommendations.pdf')
          assert p.exists() and p.stat().st_size > 50000
          doc=fitz.open(p)
          assert len(doc) == 7, f'Expected 7 pages, got {len(doc)}'
          text='\n'.join(page.get_text() for page in doc)
          required=[
            'Approve controlled pilot planning',
            'Shuffled vs Ordered Validation',
            'Period-Local Lift by Call Depth',
            '1.853857',
            '228 subscribers',
            'DO NOT APPROVE FOR UNRESTRICTED PRODUCTION DEPLOYMENT'
          ]
          for phrase in required:
              assert phrase.lower() in text.lower(), f'Missing required phrase: {phrase}'
          assert 'confusion matrix' not in text.lower()
          total_images=0
          for i,page in enumerate(doc, start=1):
              rect=page.rect
              blocks=page.get_text('blocks')
              assert blocks, f'Page {i} has no text blocks'
              for b in blocks:
                  x0,y0,x1,y1=b[:4]
                  assert x0 >= -2 and y0 >= -2 and x1 <= rect.width+2 and y1 <= rect.height+2, f'Out-of-page text on page {i}: {b[:4]}'
              total_images += len(page.get_images(full=True))
              pix=page.get_pixmap(matrix=fitz.Matrix(1.5,1.5), alpha=False)
              assert pix.width > 800 and pix.height > 1100
          assert total_images >= 2, f'Expected at least 2 notebook figures, found {total_images}'
          print('BUSINESS REPORT QA PASS')
          print('pages=',len(doc),'images=',total_images,'bytes=',p.stat().st_size)
          PY
