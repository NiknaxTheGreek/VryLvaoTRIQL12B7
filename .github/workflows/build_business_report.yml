name: Build final business report

on:
  push:
    paths:
      - '.github/workflows/build_business_report.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install reportlab pillow
      - name: Build report from executed notebook evidence
        run: python build_business_report.py
      - name: Validate PDF
        run: |
          test -s Business_Recommendations.pdf
          python - <<'PY'
          from pathlib import Path
          data=Path('Business_Recommendations.pdf').read_bytes()
          assert data[:5] == b'%PDF-'
          assert len(data) > 50000
          print('PDF validation PASS', len(data))
          PY
      - name: Commit final report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Business_Recommendations.pdf
          git commit -m 'Rebuild business recommendations from final notebook evidence'
          git push origin main
