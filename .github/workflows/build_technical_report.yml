name: Build final technical report

on:
  push:
    paths:
      - '.github/workflows/build_technical_report.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt reportlab pillow lxml nbclient nbformat pymupdf

      - name: Clean report-facing Notebook 3 panels and execute
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient

          p = Path('03_features_imbalance.ipynb')
          nbj = json.loads(p.read_text())
          changed = 0
          for cell in nbj['cells']:
              if cell.get('cell_type') != 'code':
                  continue
              src = ''.join(cell.get('source', []))
              if 'Feature Reduction' in src and 'Six-Metric Holdout Comparison' in src:
                  old = '''handles, labels = axes[0].get_legend_handles_labels()\nfig.legend(handles, labels, loc="upper center", ncol=2, frameon=False)\nfig.suptitle("Feature Reduction — Six-Metric Holdout Comparison", y=1.02)\nfig.tight_layout()'''
                  new = '''handles, labels = axes[0].get_legend_handles_labels()\nfig.suptitle("Feature Reduction - Six-Metric Holdout Comparison", y=0.995)\nfig.legend(handles, labels, loc="upper center", bbox_to_anchor=(0.5, 0.955), ncol=2, frameon=False)\nfig.tight_layout(rect=[0, 0, 1, 0.91])'''
                  if old in src:
                      src = src.replace(old, new)
                      changed += 1
              if 'Class-Imbalance Strategies' in src and 'Six-Metric Holdout Comparison' in src:
                  old = '''handles, labels = axes[0].get_legend_handles_labels()\nfig.legend(handles, labels, loc="upper center", ncol=2, frameon=False)\nfig.suptitle("Class-Imbalance Strategies — Six-Metric Holdout Comparison", y=1.02)\nfig.tight_layout()'''
                  new = '''handles, labels = axes[0].get_legend_handles_labels()\nfig.suptitle("Class-Imbalance Strategies - Six-Metric Holdout Comparison", y=0.995)\nfig.legend(handles, labels, loc="upper center", bbox_to_anchor=(0.5, 0.955), ncol=2, frameon=False)\nfig.tight_layout(rect=[0, 0, 1, 0.91])'''
                  if old in src:
                      src = src.replace(old, new)
                      changed += 1
              cell['source'] = src.splitlines(True)

          if changed != 2:
              raise RuntimeError(f'Expected 2 Notebook 3 plot patches, applied {changed}')
          p.write_text(json.dumps(nbj, indent=1))

          nb = nbformat.read(p, as_version=4)
          executed = NotebookClient(nb, timeout=600, kernel_name='python3', allow_errors=False).execute(cwd='.')
          nbformat.write(executed, p)
          print('Notebook 3 executed successfully after report-facing plot cleanup.')
          PY

      - name: Restore tested technical-report builder
        run: |
          python - <<'PY'
          import base64, gzip
          b64 = ''''''
          Path('/tmp/build_technical_report.py').write_bytes(gzip.decompress(base64.b64decode(b64)))
          print('Builder restored:', Path('/tmp/build_technical_report.py').stat().st_size, 'bytes')
          PY

      - name: Build and preflight Technical Report
        run: |
          python /tmp/build_technical_report.py
          python - <<'PY'
          from pathlib import Path
          import fitz
          p = Path('Technical_Report.pdf')
          if not p.exists() or p.stat().st_size < 200000:
              raise RuntimeError('Technical_Report.pdf missing or unexpectedly small')
          doc = fitz.open(p)
          if len(doc) < 15:
              raise RuntimeError(f'Unexpected page count: {len(doc)}')
          text = '\n'.join(page.get_text() for page in doc)
          forbidden = ['Confusion Matrix', 'sigmoid calibration', 'isotonic calibration']
          for term in forbidden:
              if term.lower() in text.lower():
                  raise RuntimeError(f'Forbidden stale report content found: {term}')
          required = ['Shuffled vs Ordered Validation', '1.853857', '0.566290', '0.551600', '320 candidate configurations']
          for term in required:
              if term not in text:
                  raise RuntimeError(f'Required report evidence missing: {term}')
          print('PDF preflight PASS:', len(doc), 'pages,', p.stat().st_size, 'bytes')
          PY

      - name: Commit final Notebook 3 and Technical Report
        run: |
          rm -rf _tech_figures_tmp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 03_features_imbalance.ipynb Technical_Report.pdf
          git commit -m 'Finalize technical report and report-facing notebook figures'
          git push origin HEAD:main
